# Runs on every push and pull request. See docs/TECHNICAL_ARCHITECTURE.md § 11 (CI).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xaminer
          POSTGRES_USER: xaminer
          POSTGRES_PASSWORD: ci-superuser
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U xaminer -d xaminer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Tests read these (backend/tests/services.py). REQUIRE_SERVICES=1: never skip, fail instead.
      REQUIRE_SERVICES: "1"
      TEST_SERVICES_HOST: 127.0.0.1
      POSTGRES_DB: xaminer
      POSTGRES_HOST_PORT: "15432"
      DB_MIGRATOR_PASSWORD: ci-migrator
      DB_APP_PASSWORD: ci-app
      REDIS_HOST_PORT: "16379"
      REDIS_PASSWORD: ci-redis
      S3_ACCESS_KEY: ci-storage
      S3_SECRET_KEY: ci-storage-secret-key
    steps:
      - uses: actions/checkout@v4

      # Redis is started here rather than as a service so it can require a password, like in Docker.
      - name: Start Redis
        run: docker run -d --name redis -p 16379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"

      # Object storage, like the `storage` service in Docker Compose, with the images and bundles buckets.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for i in $(seq 60); do
            docker exec storage wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && break
            sleep 2
          done
          for i in $(seq 30); do
            echo "s3.bucket.create -name images" | docker exec -i storage weed shell -master=localhost:9333               && echo "s3.bucket.create -name bundles" | docker exec -i storage weed shell -master=localhost:9333 && break
            sleep 2
          done

      - name: Create database users (same script as the db-init service)
        env:
          PGPASSWORD: ci-superuser
        run: >
          psql -h 127.0.0.1 -p 15432 -U xaminer -d xaminer
          -v migrator_password="$DB_MIGRATOR_PASSWORD" -v app_password="$DB_APP_PASSWORD"
          -v main_db=xaminer -v test_db=xaminer_test
          -f deploy/db-init/db-init.sql

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python 3.12 and dependencies
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --locked

      # Known vulnerabilities in what ships (SECURITY § 11): any one fails the build.
      - name: Dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt | grep -v '^-e' > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run mypy

      - name: Tests
        working-directory: backend
        run: |
          uv run pytest -q -n auto --maxprocesses 8 --dist loadfile -m "not serial"
          uv run pytest -q -m serial

  frontend:
    name: Frontend (lint, tests, types, build, API client up to date)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # High or critical advisories in what ships fail the build (SECURITY § 11).
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and format
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Type check and build
        working-directory: frontend
        run: npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Fails if someone changed backend endpoints but didn't run `make api-client`.
      - name: Generated API client is up to date
        run: |
          (cd backend && uv python install 3.12 && uv sync --locked)
          make api-client
          git diff --exit-code -- frontend/src/api/ || {
            echo "::error::frontend/src/api is out of date. Run 'make api-client' and commit the result."
            exit 1
          }

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example build

      # Import every backend package inside the built image from another folder, so they are found
      # only if the image itself puts them on the path (as a Celery worker needs). Catches code that
      # only works when run from the source tree.
      - name: Packages import inside the image
        run: >
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example
          run --rm --no-deps --workdir /tmp --entrypoint python app-worker -c
          "import app.main, app.questions.bundles, domain_core.timer, domain_core.shuffle, workers.app_worker.tasks, cli.commands; print('imports ok')"

  runners:
    name: Runner images and sandbox (hello-world in each language, break-out checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the four runner images
        run: python3 runners/build.py --no-load

      # Compile and run a hello-world in each, with the sandbox's container restrictions.
      - name: Hello-world in every language
        run: python3 runners/smoke_test.py

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The sandbox profile as the engine applies it, and programs that try to break out.
      - name: Sandbox checks
        working-directory: backend
        env:
          SANDBOX_TESTS: "1"
        run: |
          uv python install 3.12
          uv sync --locked
          uv run pytest -q -p no:randomly tests/sandbox

  e2e:
    name: Browser tests (full stack, accessibility, exam paths)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XAMINER_DEMO_PASSWORD: ci-demo-password-2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend packages (axe-core for the accessibility checks)
        working-directory: frontend
        run: npm ci

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend tools
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Start the whole stack with throwaway secrets
        run: |
          python3 scripts/ci_env.py
          docker compose -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/health && break; sleep 5; done

      - name: Language runners into the sandbox
        working-directory: backend
        run: uv run python ../runners/build.py

      - name: Demo data (accounts, questions, exams)
        run: make demo-data

      - name: Browser tests
        run: |
          cd backend
          uv run --no-project --with pytest --with playwright --with requests python -m playwright install --with-deps chromium
          uv run --no-project --with pytest --with playwright --with requests python -m pytest ../e2e -q -p no:cacheprovider

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 80 api app-worker exec-worker web
