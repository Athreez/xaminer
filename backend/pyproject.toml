[project]
name = "xaminer-backend"
version = "0.1.0"
description = "Xaminer API, background workers and shared domain logic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.121",
    "celery[redis]>=5.4",
    "docker>=7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.121",
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "ruff>=0.8",
    "types-docker>=7.2.0.20261006",
]

# Only in the inference-worker image (Dockerfile target `inference`): PyTorch for the CPU, the
# RT-DETR detector and OpenCV's YuNet face detector.
inference = [
    "opencv-python-headless>=4.11",
    "torch>=2.8",
    "transformers>=4.56",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "TID",      # tidy imports (banned modules per folder)
    "RUF",
]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the `alembic` import is always the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and made-up passwords are fine in tests
# Paths inside sandbox containers (their own private /tmp), not this machine's temp folder.
"workers/exec_worker/**" = ["S108"]
"tests/{sandbox/**,test_sandbox_settings.py}" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "domain_core", "workers", "cli"]

# Celery has no type information. Treat it as untyped and allow its decorators in worker code.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["workers.*"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["serial: can't run beside other tests (make test runs these after the parallel part)"]
