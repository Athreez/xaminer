[project]
name = "xaminer-backend"
version = "0.1.0"
description = "Xaminer API, background workers and shared domain logic"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "TID",      # tidy imports (banned modules per folder)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "domain_core", "workers", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
