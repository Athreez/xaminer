# Install once with:  uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: backend-lint
        name: backend lint (ruff)
        entry: make backend-lint
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint (oxlint + prettier)
        entry: make frontend-lint
        language: system
        files: ^frontend/
        pass_filenames: false
