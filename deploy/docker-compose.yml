# Xaminer — full stack. See docs/TECHNICAL_ARCHITECTURE.md § 3.
# Start:  make up      (or: docker compose -f deploy/docker-compose.yml up -d --build)
#
# Placeholder commands are marked TODO with the ticket that replaces them.

name: xaminer

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

# Untrusted-input workers get Redis only. No database or storage credentials (SECURITY § 5.5).
x-untrusted-env: &untrusted-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  # ---------------------------------------------------------------- public entry point
  web:
    build: ../frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [frontend]
    restart: unless-stopped

  # ---------------------------------------------------------------- trusted zone (Z1)
  api:
    build: { context: ../backend, target: app }
    # Only nginx can reach the API (frontend network), so trusting its X-Forwarded-* headers is safe.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    networks: [frontend, backend]
    restart: unless-stopped

  app-worker:
    build: { context: ../backend, target: app }
    # TODO(TCK-0006): replace with the Celery worker.
    command: ["sleep", "infinity"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped

  scheduler:
    build: { context: ../backend, target: app }
    # TODO(TCK-0006): replace with Celery Beat.
    command: ["sleep", "infinity"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped

  # ---------------------------------------------------------------- untrusted-input workers (Z2)
  exec-worker:
    build: { context: ../backend, target: exec }
    # TODO(TCK-0803): replace with the execution worker.
    command: ["sleep", "infinity"]
    environment:
      <<: *untrusted-env
      DOCKER_HOST: tcp://sandbox-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - sandbox-certs:/certs/client:ro
    depends_on:
      redis: { condition: service_healthy }
      sandbox-docker: { condition: service_healthy }
    networks: [exec]
    restart: unless-stopped

  # Separate Docker engine for student code (SECURITY § 7.2). Must be privileged to run containers.
  sandbox-docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - sandbox-certs:/certs/client
      - sandbox-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [exec]
    restart: unless-stopped

  inference-worker:
    build: { context: ../backend, target: inference }
    # TODO(TCK-1103): replace with the inference worker.
    command: ["sleep", "infinity"]
    environment: *untrusted-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [inference]
    restart: unless-stopped

  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432" # local dev tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend, exec, inference]
    restart: unless-stopped

  # S3-compatible object storage. Buckets: evidence, bundles, images.
  storage:
    image: chrislusf/seaweedfs:4.48
    # Listen on every attached network (backend, exec, inference), not just the first one.
    command: ["server", "-s3", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333" # local dev tools only
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend, exec, inference]
    restart: unless-stopped

  storage-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "-c"]
    command:
      - |
        for b in evidence bundles images; do
          echo "s3.bucket.create -name $$b" | weed shell -master=storage:9333 || true
        done
    depends_on:
      storage: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025" # web UI to read dev emails
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
  exec:
  inference:

volumes:
  postgres-data:
  redis-data:
  storage-data:
  sandbox-data:
  sandbox-certs:
