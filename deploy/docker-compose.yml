# Xaminer — full stack. See docs/TECHNICAL_ARCHITECTURE.md § 3.
# Start:  make up      (or: docker compose -f deploy/docker-compose.yml up -d --build)
#
# Placeholder commands are marked TODO with the ticket that replaces them.

name: xaminer

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Backend containers connect as the limited `app` user, never as the superuser (SECURITY § 5.6).
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  # Email: Mailpit in development; set these in .env for a real mail server.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  MAIL_FROM: ${MAIL_FROM:-Xaminer <no-reply@xaminer.local>}
  MAIL_SKIP_DOMAINS: ${MAIL_SKIP_DOMAINS:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  LOGIN_RATE_PER_MINUTE: ${LOGIN_RATE_PER_MINUTE:-10} # logins per minute from one address
  JWT_SECRET: ${JWT_SECRET}

# Untrusted-input workers get Redis only. No database or storage credentials (SECURITY § 5.5).
x-untrusted-env: &untrusted-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  # ---------------------------------------------------------------- public entry point
  web:
    build: ../frontend
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    environment:
      CERT_HOSTS: ${CERT_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-app.conf:/etc/nginx/xaminer-app.conf:ro
      - web-certs:/etc/nginx/certs
    depends_on:
      - api
      - storage
    networks: [frontend]
    restart: unless-stopped

  # ---------------------------------------------------------------- trusted zone (Z1)
  api:
    build: { context: ../backend, target: app }
    # Only nginx can reach the API (frontend network), so trusting its X-Forwarded-* headers is safe.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log",
       "--workers", "${API_WORKERS:-4}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    networks: [frontend, backend]
    restart: unless-stopped

  app-worker:
    build: { context: ../backend, target: app }
    command:
      ["celery", "-A", "workers.app_worker", "worker", "--hostname=app-worker@%h",
       "--queues=default,grading,exec.results,inference.results,maintenance,notify",
       "--concurrency=4", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.app_worker inspect ping -d app-worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped

  scheduler:
    build: { context: ../backend, target: app }
    # Only one scheduler may run, or scheduled jobs would be queued twice.
    command: ["celery", "-A", "workers.app_worker", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    restart: unless-stopped

  # ---------------------------------------------------------------- untrusted-input workers (Z2)
  exec-worker:
    build: { context: ../backend, target: exec }
    # Runs untrusted code on sandbox-docker; holds no database or storage credentials.
    command: ["celery", "-A", "workers.exec_worker", "worker", "--queues=exec.validation,exec.submit,exec.run", "--concurrency=${EXEC_CONCURRENCY:-2}", "--hostname=exec@%h", "--loglevel=INFO"]
    environment:
      <<: *untrusted-env
      DOCKER_HOST: tcp://sandbox-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - sandbox-tls:/certs:ro  # only client/ is used: the client certificate and the CA
    depends_on:
      redis: { condition: service_healthy }
      sandbox-docker: { condition: service_healthy }
    networks: [exec]
    restart: unless-stopped

  # Separate Docker engine for student code (SECURITY § 7.2). Must be privileged to run containers.
  sandbox-docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      # The worker reaches it by this name, so the server certificate must carry it.
      DOCKER_TLS_SAN: DNS:sandbox-docker
    volumes:
      # The whole TLS folder (CA, server, client) in one volume: they're made together on first
      # start and must stay matched, or the worker can't connect after the container is recreated.
      - sandbox-tls:/certs
      - sandbox-data:/var/lib/docker
    # In memory, so a stale containerd pid file from an unclean shutdown can't survive a restart
    # (otherwise the engine waits forever for a containerd that isn't running).
    tmpfs:
      - /var/run
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [exec]
    restart: unless-stopped

  inference-worker:
    build: { context: ../backend, target: inference }
    # TODO(TCK-1103): replace with the inference worker.
    command: ["sleep", "infinity"]
    environment: *untrusted-env
    depends_on:
      redis: { condition: service_healthy }
    networks: [inference]
    restart: unless-stopped

  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432" # local dev tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  # Nightly backups (TCK-1406): database dump + stored files, kept 7 days in BACKUP_DIR.
  # `make backup` runs one now, `make backup-check` tests a restore, `make restore` puts one back.
  backup: &backup
    image: postgres:16-alpine
    entrypoint: ["sh", "/scripts/nightly.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_HOUR: ${BACKUP_HOUR:-20}
      BACKUP_MINUTE: ${BACKUP_MINUTE:-30}
    volumes:
      - ./backup:/scripts:ro
      - storage-data:/storage:ro
      - ${BACKUP_DIR:-../backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  # Only for `make restore`: like backup, but may write the stored files.
  restore:
    <<: *backup
    entrypoint: ["sh"]
    volumes:
      - ./backup:/scripts:ro
      - storage-data:/storage
      - ${BACKUP_DIR:-../backups}:/backups
    restart: "no"
    profiles: [restore]

  # One-off: create the `migrator` and `app` database users and the test database (safe to re-run).
  db-init:
    image: postgres:16-alpine
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        -v migrator_password="$$DB_MIGRATOR_PASSWORD" -v app_password="$$DB_APP_PASSWORD"
        -v main_db="$$POSTGRES_DB" -v test_db="$${POSTGRES_DB}_test"
        -f /db-init/db-init.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./db-init:/db-init:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  # One-off: apply database migrations as `migrator`, before api and app-worker start.
  migrate:
    build: { context: ../backend, target: app }
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [backend]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379" # local dev tools and tests only
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend, exec, inference]
    restart: unless-stopped

  # S3-compatible object storage. Buckets: evidence, bundles, images.
  storage:
    image: chrislusf/seaweedfs:4.48
    # Listen on every attached network (backend, exec, inference), not just the first one.
    command: ["server", "-s3", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333" # local dev tools only
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    # frontend: nginx serves signed image links from it (deploy/nginx.conf, /images/).
    networks: [frontend, backend, exec, inference]
    restart: unless-stopped

  storage-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "-c"]
    command:
      - |
        for b in evidence bundles images; do
          echo "s3.bucket.create -name $$b" | weed shell -master=storage:9333 || true
        done
    depends_on:
      storage: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025" # web UI to read dev emails
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
  exec:
  inference:

volumes:
  postgres-data:
  redis-data:
  storage-data:
  sandbox-data:
  sandbox-tls:
  web-certs:
