# Plain HTTP (http://localhost:8080 in development) and HTTPS (the demo: other devices on the
# Wi-Fi need it for the camera and secure cookies). Both serve the same app (nginx-app.conf).
server {
    listen 80;
    server_name _;
    include /etc/nginx/xaminer-app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    # Made on first start by the web image (docker/self-signed-cert.sh), or your own.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/xaminer-app.conf;
}
