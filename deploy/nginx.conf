server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # API: same origin as the app, so no CORS is needed (SECURITY_AND_ACCESS.md § 5.1).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite (never append to) any address the client sent: the API uses this for per-IP
        # rate limits, so a client must not be able to choose its own "IP" (SECURITY § 5.3).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # React single-page app: unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
